<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Free Image to Video</title>
<link rel="stylesheet" href="style.css">
<style>
  body { width: 380px; padding: 14px; overflow-x: hidden; }
  header { margin-bottom: 12px; }
  #credits { font-size: 11px; color: var(--muted); text-align: right; line-height: 1.3; }
  #credits b { color: var(--ink); font-size: 13px; }
  .nokey { margin-bottom: 12px; }
  .nokey p { margin: 0 0 10px; }
  .drop { display: flex; gap: 10px; align-items: center; border: 1px dashed var(--line); border-radius: 10px; padding: 8px; margin-bottom: 10px; }
  .drop img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: #f2ebf5; }
  .drop .txt { flex: 1; min-width: 0; font-size: 12px; }
  .drop .txt .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .compose .row { margin-top: 10px; }
  .hint { font-size: 11.5px; margin: 10px 2px 0; }
  h2 { font-size: 12px; margin: 16px 2px 6px; color: var(--muted); }
  #jobs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 280px; overflow-y: auto; }
  #jobs li { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  #jobs .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #jobs .meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11px; color: var(--muted); }
  #jobs video { display: block; width: 100%; border-radius: 8px; margin-top: 6px; background: #000; }
  #jobs .err { color: var(--bad); font-size: 11.5px; margin-top: 3px; }
  footer { display: flex; gap: 12px; margin-top: 12px; font-size: 12px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <header class="row">
    <div class="brand">
      <img src="icons/icon48.png" alt="">
      <div><b>Free Image to Video</b><small>Any photo to a clip with sound</small></div>
    </div>
    <div class="spacer"></div>
    <div id="credits"></div>
  </header>
  <div class="card nokey" id="nokey" hidden>
    <p>Paste your Free Image to Video API key to start.</p>
    <button class="btn block" id="openOptions">Set API key</button>
  </div>
  <div class="card compose">
    <div class="drop">
      <img id="thumb" alt="" hidden>
      <div class="txt">
        <div class="name" id="imgname">No photo: this makes a text to video clip.</div>
        <div class="row" style="margin-top:6px">
          <label class="btn ghost small" for="file">Pick a photo</label>
          <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
          <button class="btn ghost small" id="noimg" hidden>Remove</button>
        </div>
      </div>
    </div>
    <textarea id="prompt" rows="3" placeholder="the camera slowly pushes in, hair moving in the wind"></textarea>
    <div class="row"><div class="spacer"></div><button class="btn" id="go">Make video</button></div>
    <div class="msg" id="msg"></div>
  </div>
  <p class="hint muted">Or right-click any image on a page and choose "Turn this image into a video".</p>
  <div class="row"><h2>Recent clips</h2><div class="spacer"></div><button class="btn ghost small" id="clear" hidden>Clear finished</button></div>
  <ul id="jobs"></ul>
  <div id="empty" class="muted">None yet.</div>
  <footer>
    <a href="#" id="settings">Settings</a>
    <a href="#" id="site">freeimagetovideo.ai</a>
    <a href="#" id="pricing">Plans</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
